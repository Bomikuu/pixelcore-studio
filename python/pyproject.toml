[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "shared-website-builder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Django>=5.2,<6.1", "Pillow>=11.0"]
[tool.setuptools.packages.find]
where = ["."]
include = ["website_builder*"]
